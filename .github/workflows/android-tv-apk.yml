name: Build NextDNS TV APK

on:
  push:
    branches: [main]
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv-apk.yml"
      - "index.html"
      - "app.js"
      - "style.css"
      - "pro-features.js"
      - "wireguard.js"
      - "ai-assistant.js"
      - "ai-worker.js"
  create:
    tags:
      - "tv-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android TV APK
        run: gradle assembleDebug
      - name: Rename APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NextDNS-PRO-TV.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextdns-tv-apk
          path: android-tv/app/build/outputs/apk/debug/NextDNS-PRO-TV.apk
      - name: Publish latest Android TV APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-latest
          name: NextDNS PRO TV - Latest
          make_latest: true
          files: android-tv/app/build/outputs/apk/debug/NextDNS-PRO-TV.apk
          overwrite_files: true

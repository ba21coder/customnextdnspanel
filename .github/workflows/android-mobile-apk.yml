name: Build NextDNS Mobile APK

on:
  push:
    branches: [main]
    paths:
      - "android-mobile/**"
      - ".github/workflows/android-mobile-apk.yml"
      - "index.html"
      - "app.js"
      - "style.css"
      - "pro-features.js"
      - "wireguard.js"
      - "ai-assistant.js"
      - "ai-worker.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build mobile APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NextDNS-PRO-Mobile.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextdns-mobile-apk
          path: android-mobile/app/build/outputs/apk/debug/NextDNS-PRO-Mobile.apk
      - name: Publish latest mobile APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: NextDNS PRO Mobile - Latest
          files: android-mobile/app/build/outputs/apk/debug/NextDNS-PRO-Mobile.apk
          overwrite_files: true
